[project]
name = "regatta"
version = "0.1.0"
description = "Windward-leeward sailing brain and offline physics oracle for LOTUSim"
requires-python = ">=3.12"
license = { text = "EPL-2.0" }
authors = [{ name = "Cyril Moron", email = "cyril.moron@gmail.com" }]
# Deliberately empty, and it must stay empty. The ROS node and the gz smoke gate
# import this package from the SYSTEM Python (rclpy and gz-transport come from apt,
# not PyPI) through PYTHONPATH -- which only works while there is nothing to
# install. See docs/design/2026-07-26-layout-and-docs-design.md, D1.
dependencies = []

[project.scripts]
regatta-oracle = "regatta.oracle:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regatta"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# 100 rather than the default 88: this code carries long explanatory comments and
# f-strings, and at 88 the formatter breaks calls that read perfectly well on one
# line. The whole repository was formatted once at this width -- see
# .git-blame-ignore-revs -- so any reflow in a future diff is a real change.
line-length = 100
# archive/ is frozen history, kept to record how decisions were reached. Reformatting
# it would rewrite the record while changing nothing that runs.
exclude = ["archive"]
